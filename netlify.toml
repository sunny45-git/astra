# ==============================================================================
# Netlify Production Configuration for ASTRA
# ==============================================================================

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# ------------------------------------------------------------------------------
# 1. API PROXY REWRITE
# NOTE: Replace 'https://YOUR_BACKEND_URL_HERE.onrender.com' with your actual live
# backend URL (e.g., from Render, Railway, or Fly.io) once your backend is deployed.
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL_HERE.onrender.com/api/:splat"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# 2. UPLOADED ASSETS PROXY REWRITE
# Proxies uploaded screenshots and media directly from the hosted backend service.
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR_BACKEND_URL_HERE.onrender.com/uploads/:splat"
  status = 200
  force = true

# ------------------------------------------------------------------------------
# 3. REACT ROUTER SPA FALLBACK
# Essential for Single Page Application routing (e.g., /admin/login, /admin/dashboard).
# Direct visits and browser refreshes will properly route to index.html with HTTP 200.
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
